spring:
  application:
    name: notification-service

  # ═══════════════════════════════════════════════════════════
  #  Kafka : contrairement au booking-service, Kafka N'EST PAS
  #  exclu ici, c'est la raison d'être de ce service. Sans broker
  #  disponible en local, l'app démarre quand même (le consumer
  #  retente la connexion en arrière-plan), mais rien ne sera
  #  consommé tant que Kafka n'est pas up.
  # ═══════════════════════════════════════════════════════════
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # ═══════════════════════════════════════════════════════════
  #  Mail - Sprint 5.3 : envoi réel via JavaMailSender.
  #  Port 1025 = port standard MailHog/Mailpit pour tester en local
  #  sans vrai provider SMTP (aucune authentification nécessaire
  #  avec ces outils). En prod, remplacer host/port/username/password
  #  par un vrai provider (SendGrid, SES, etc.) via variables d'env.
  # ═══════════════════════════════════════════════════════════
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: 8084

# ═══════════════════════════════════════════════════════════
#  JWT
#  Même secret que l'auth-service et les autres services métier.
#  Le notification-service ne génère pas de JWT, il valide
#  uniquement les tokens émis par l'auth-service (préparé pour un
#  futur endpoint protégé, aucune route ne l'utilise encore).
# ═══════════════════════════════════════════════════════════
jwt:
  secret: juribook-secret-key-must-be-at-least-256-bits-long-for-hs256

# ═══════════════════════════════════════════════════════════
#  URLs des autres microservices, consultés pour enrichir les
#  événements Kafka reçus (résolution d'ids en données lisibles).
#  En conteneur Docker, surchargées par les variables d'env
#  correspondantes.
# ═══════════════════════════════════════════════════════════
booking-service:
  base-url: ${BOOKING_SERVICE_BASE_URL:http://localhost:8083}

lawyer-service:
  base-url: ${LAWYER_SERVICE_BASE_URL:http://localhost:8082}

auth-service:
  base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false