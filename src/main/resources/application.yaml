spring:
  application:
    name: notification-service

  # ═══════════════════════════════════════════════════════════
  #  Persistence, jamais utilisé jusqu'ici. Le service se
  #  connectait déjà à PostgreSQL mais sans JPA/Flyway configurés (pas
  #  de table métier avant la table notifications).
  #  Port 5435 en local, voir docker-compose.yml (postgres-notification)
  #  En conteneur Docker, surchargé par SPRING_DATASOURCE_URL
  # ═══════════════════════════════════════════════════════════
  datasource:
    url: jdbc:postgresql://localhost:5435/notificationdb
    username: juribook
    password: juribook
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true

  # ═══════════════════════════════════════════════════════════
  #  Kafka : contrairement au booking-service, Kafka N'EST PAS
  #  exclu ici, c'est la raison d'être de ce service. Sans broker
  #  disponible en local, l'app démarre quand même (le consumer
  #  retente la connexion en arrière-plan), mais rien ne sera
  #  consommé tant que Kafka n'est pas up.
  # ═══════════════════════════════════════════════════════════
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # ═══════════════════════════════════════════════════════════
  #  Mail - envoi réel via JavaMailSender.
  #  Port 1025 = port standard MailHog/Mailpit pour tester en local.
  # ═══════════════════════════════════════════════════════════
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: 8084

# ═══════════════════════════════════════════════════════════
#  JWT
#  Même secret que l'auth-service et les autres services métier.
#  Le notification-service ne génère pas de JWT, il valide
#  uniquement les tokens émis par l'auth-service.
# ═══════════════════════════════════════════════════════════
jwt:
  secret: juribook-secret-key-must-be-at-least-256-bits-long-for-hs256

# ═══════════════════════════════════════════════════════════
#  URLs des autres microservices, consultés pour enrichir les
#  événements Kafka reçus (résolution d'ids en données lisibles).
#  En conteneur Docker, surchargées par les variables d'env
#  correspondantes.
# ═══════════════════════════════════════════════════════════
booking-service:
  base-url: ${BOOKING_SERVICE_BASE_URL:http://localhost:8083}

lawyer-service:
  base-url: ${LAWYER_SERVICE_BASE_URL:http://localhost:8082}

auth-service:
  base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false